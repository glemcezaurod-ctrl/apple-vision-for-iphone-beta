<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>VisionOS Ultimate v14.0</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .eye { width: 50%; height: 100vh; position: relative; border-right: 1px solid #222; float: left; }
    video { display: none; }
    #ui_layer { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 2000; text-align: center; }
    button { padding: 20px 40px; border-radius: 50px; border: none; font-weight: bold; cursor: pointer; font-size: 1.2rem; background: linear-gradient(45deg, #00ffd5, #0077ff); color: white; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
    
    /* Окно плеера - вынесено так, чтобы не мешать трекингу рук */
    #video_container { 
        position: fixed; width: 400px; height: 225px; 
        bottom: 10%; left: 50%; transform: translateX(-50%); 
        z-index: 100; display: none; border-radius: 12px; 
        overflow: hidden; box-shadow: 0 0 30px rgba(255,0,0,0.4); 
        background: #000;
    }
    iframe { width: 100%; height: 100%; }
  </style>
</head>
<body>
  <div id="ui_layer">
    <h1 style="color: white; text-shadow: 0 0 15px #00ffd5;">VisionOS v14.0</h1>
    <button id="start_btn">ВОЙТИ В СИСТЕМУ</button>
  </div>

  <div id="video_container"><iframe id="yt_player" src="" frameborder="0" allow="autoplay; encrypted-media; fullscreen"></iframe></div>
  
  <video id="input_video" playsinline></video>
  <div id="left" class="eye"></div>
  <div id="right" class="eye"></div>

  <script>
    const videoElement = document.getElementById('input_video');
    const videoTexture = new THREE.VideoTexture(videoElement);
    const cityTexture = new THREE.TextureLoader().load('https://images.unsplash.com/photo-1477959858617-67f85cf4f1df?q=80&w=1000');
    
    const eyeConfigs = [];
    let isVR = false, typedText = "Система активна.\nЖду команд...", cooldown = false;
    let state = { winX: 0, winY: 0.5, isListening: false };

    // --- МОЗГ ИИ (Speech API) ---
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    
    if(recognition) {
        recognition.lang = 'ru-RU';
        recognition.onresult = (e) => {
            const cmd = e.results[0][0].transcript.toLowerCase();
            let reply = "";
            const player = document.getElementById('yt_player');
            const container = document.getElementById('video_container');

            if(cmd.includes("включи") || cmd.includes("видео") || cmd.includes("горки") || cmd.includes("ютуб")) {
                container.style.display = "block";
                // Используем проверенное видео (Rollercoaster 360)
                const videoId = "LXl2d7LDt6o"; 
                player.src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
                reply = "Запускаю медиаплеер...";
            } else if(cmd.includes("закрой") || cmd.includes("стоп") || cmd.includes("выключи")) {
                container.style.display = "none";
                player.src = "";
                reply = "Плеер закрыт.";
            } else if(cmd.includes("привет") || cmd.includes("здравствуй")) {
                reply = "Привет, Брат! Системы VisionOS к работе готовы.";
            } else if(cmd.includes("кто ты")) {
                reply = "Я твой персональный ИИ-интерфейс.";
            } else if(cmd.includes("как дела")) {
                reply = "Статус системы: 100%. Все модули в норме.";
            } else if(cmd.includes("фон") || cmd.includes("город")) {
                isVR = !isVR;
                reply = "Режим погружения изменен.";
            } else {
                reply = "Понял тебя: " + cmd;
            }
            typedText = "Вы: " + cmd + "\nИИ: " + reply;
        };
        recognition.onend = () => { state.isListening = false; };
    }

    // --- ОТРИСОВКА ИНТЕРФЕЙСА ---
    function createTextCanvas(text) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = 'rgba(255, 255, 255, 0.9)'; 
      ctx.font = 'bold 26px Arial';
      text.split('\n').forEach((line, i) => ctx.fillText(line, 20, 50 + i*40));
      return new THREE.CanvasTexture(canvas);
    }

    function initEye(id) {
      const container = document.getElementById(id);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-2, 2, 1.2, -1.2, 0.1, 10);
      camera.position.z = 5;
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth / 2, window.innerHeight);
      container.appendChild(renderer.domElement);

      const vPlane = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 3.5), new THREE.MeshBasicMaterial({ map: videoTexture }));
      scene.add(vPlane);
      
      const cPlane = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 3.5), new THREE.MeshBasicMaterial({ map: cityTexture, transparent: true, opacity: 0 }));
      scene.add(cPlane);

      // Окно заметок (Центральный хаб)
      const noteGroup = new THREE.Group();
      noteGroup.add(new THREE.Mesh(new THREE.PlaneGeometry(1.7, 0.9), new THREE.MeshBasicMaterial({ color: 0x000000, opacity: 0.75, transparent: true })));
      const noteText = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.8), new THREE.MeshBasicMaterial({ transparent: true }));
      noteGroup.add(noteText); 
      scene.add(noteGroup);

      // Сферы управления
      const spheres = {
          vr: new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({ color: 0xffffff })), // Белая
          ai: new THREE.Mesh(new THREE.SphereGeometry(0.12), new THREE.MeshBasicMaterial({ color: 0x9900ff })), // Фиолетовая
          yt: new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({ color: 0xff0000 }))  // Красная
      };
      spheres.vr.position.set(1.7, 0.9, 0.8);
      spheres.yt.position.set(-1.7, 0.9, 0.8);
      spheres.ai.position.set(0, -0.85, 0.8);
      Object.values(spheres).forEach(s => scene.add(s));

      const joints = [];
      for(let i=0; i<21; i++) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(0.02), new THREE.MeshBasicMaterial({color: 0x00ffcc}));
        scene.add(s); joints.push(s);
      }

      return { scene, camera, renderer, vPlane, cPlane, joints, noteGroup, noteText, spheres };
    }

    eyeConfigs.push(initEye('left'), initEye('right'));

    // --- ГЛАВНЫЙ ЦИКЛ (Трекинг и Логика) ---
    function onResults(results) {
      eyeConfigs.forEach((config) => {
        config.joints.forEach(j => j.visible = false);
        
        if (results.multiHandLandmarks && results.multiHandLandmarks[0]) {
          const landmarks = results.multiHandLandmarks[0];
          const tip = landmarks[8], thumb = landmarks[4];
          const x = (tip.x - 0.5) * 4, y = (0.5 - tip.y) * 2.4;
          
          landmarks.forEach((lp, i) => {
            config.joints[i].visible = true;
            config.joints[i].position.set((lp.x - 0.5) * 4, (0.5 - lp.y) * 2.4, 1.1);
          });

          const isPinching = Math.sqrt(Math.pow(tip.x - thumb.x, 2) + Math.pow(tip.y - thumb.y, 2)) < 0.05;

          if(isPinching && !cooldown) {
            // 1. Смена VR режима (Белая сфера)
            if(Math.sqrt(Math.pow(x-1.7,2)+Math.pow(y-0.9,2)) < 0.25) { 
                isVR = !isVR; cooldown = true; 
                if(navigator.vibrate) navigator.vibrate(50);
            }
            // 2. Активация ИИ (Фиолетовая сфера)
            else if(Math.sqrt(Math.pow(x-0,2)+Math.pow(y+0.85,2)) < 0.3) { 
                if(recognition && !state.isListening) { recognition.start(); state.isListening = true; }
                cooldown = true; 
                if(navigator.vibrate) navigator.vibrate(100);
            }
            // 3. Закрыть YouTube (Красная сфера)
            else if(Math.sqrt(Math.pow(x+1.7,2)+Math.pow(y-0.9,2)) < 0.25) {
                document.getElementById('video_container').style.display = "none";
                document.getElementById('yt_player').src = "";
                cooldown = true;
            }
            // 4. Перемещение окна (Захват за центр)
            else if(Math.sqrt(Math.pow(x-state.winX,2)+Math.pow(y-state.winY,2)) < 0.7) {
                state.winX = x; state.winY = y;
            }
            
            if(cooldown) setTimeout(() => cooldown = false, 800);
          }
          config.noteGroup.position.set(state.winX, state.winY, 0.5);
          config.spheres.ai.scale.setScalar(state.isListening ? 1.4 : 1);
        }
        
        // Рендеринг изменений
        config.noteText.material.map = createTextCanvas(typedText);
        config.cPlane.material.opacity += ((isVR ? 1 : 0) - config.cPlane.material.opacity) * 0.15;
        config.vPlane.material.opacity = 1 - config.cPlane.material.opacity;
        config.renderer.render(config.scene, config.camera);
      });
    }

    const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.75 });
    hands.onResults(onResults);
    
    const cam = new Camera(videoElement, { 
        onFrame: async () => { await hands.send({image: videoElement}); }, 
        facingMode: 'environment', width: 1280, height: 720 
    });

    document.getElementById('start_btn').onclick = () => { 
        document.getElementById('ui_layer').style.display='none'; 
        cam.start(); 
    };
  </script>
</body>
</html>
