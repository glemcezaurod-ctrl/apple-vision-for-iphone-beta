<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    body { margin: 0; overflow: hidden; background: #000; display: flex; }
    .eye { width: 50vw; height: 100vh; position: relative; border-right: 1px solid #333; overflow: hidden; }
    video { display: none; }
    #ui { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 1000; text-align: center; color: white; }
    button { padding: 20px 40px; border-radius: 30px; border: none; background: #00ffcc; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>
  <div id="ui">
    <h1>VISION OS STEREO</h1>
    <button id="start">ЗАПУСТИТЬ STEREO</button>
  </div>
  <video id="input_video" playsinline></video>
  <div id="left" class="eye"></div>
  <div id="right" class="eye"></div>

  <script>
    const videoElement = document.getElementById('input_video');
    const videoTexture = new THREE.VideoTexture(videoElement);
    const eyeConfigs = [];
    let isVR = false, typedText = "Stereo Mode Active", cooldown = false;
    let state = { winX: 0, winY: 0.5, vidX: 0, vidY: -0.4, showVid: false };

    // ИИ и Голос
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;
    if(recognition) {
        recognition.lang = 'ru-RU';
        recognition.onresult = (e) => {
            const cmd = e.results[0][0].transcript.toLowerCase();
            if(cmd.includes("видео") || cmd.includes("горки")) {
                state.showVid = true;
                typedText = "Вы: " + cmd + "\nИИ: Видео-панель активирована!";
            } else if(cmd.includes("закрой")) {
                state.showVid = false;
            } else {
                typedText = "Вы: " + cmd + "\nИИ: Принято.";
            }
        };
    }

    function createTextCanvas(text, bg = "rgba(0,0,0,0.7)") {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = bg; ctx.fillRect(0,0,512,256);
      ctx.fillStyle = 'white'; ctx.font = 'bold 30px Arial';
      text.split('\n').forEach((l, i) => ctx.fillText(l, 20, 50 + i*45));
      return new THREE.CanvasTexture(canvas);
    }

    function initEye(id) {
      const container = document.getElementById(id);
      const scene = new THREE.Scene();
      const camera = new THREE.OrthographicCamera(-2, 2, 1.2, -1.2, 0.1, 10);
      camera.position.z = 5;
      const renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth / 2, window.innerHeight);
      container.appendChild(renderer.domElement);

      const bg = new THREE.Mesh(new THREE.PlaneGeometry(4.5, 3.5), new THREE.MeshBasicMaterial({ map: videoTexture }));
      scene.add(bg);

      // Панель заметок
      const notes = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.8), new THREE.MeshBasicMaterial({ transparent: true }));
      scene.add(notes);

      // Панель Видео (Заглушка, так как iframe в 3D сложен, используем визуальный холст)
      const vidPanel = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.9), new THREE.MeshBasicMaterial({ color: 0xff0000, transparent: true }));
      scene.add(vidPanel);

      // Сферы
      const spheres = {
          ai: new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({ color: 0x9900ff })),
          vr: new THREE.Mesh(new THREE.SphereGeometry(0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }))
      };
      spheres.ai.position.set(0, -0.9, 0.8);
      spheres.vr.position.set(1.7, 0.9, 0.8);
      scene.add(spheres.ai); scene.add(spheres.vr);

      const joints = [];
      for(let i=0; i<21; i++) {
        const s = new THREE.Mesh(new THREE.SphereGeometry(0.02), new THREE.MeshBasicMaterial({color: 0x00ffcc}));
        scene.add(s); joints.push(s);
      }

      return { scene, camera, renderer, notes, vidPanel, joints, spheres };
    }

    eyeConfigs.push(initEye('left'), initEye('right'));

    function onResults(results) {
      eyeConfigs.forEach((config) => {
        config.joints.forEach(j => j.visible = false);
        if (results.multiHandLandmarks && results.multiHandLandmarks[0]) {
          const landmarks = results.multiHandLandmarks[0];
          const tip = landmarks[8], thumb = landmarks[4];
          const x = (tip.x - 0.5) * 4, y = (0.5 - tip.y) * 2.4;

          landmarks.forEach((lp, i) => {
            config.joints[i].visible = true;
            config.joints[i].position.set((lp.x - 0.5) * 4, (0.5 - lp.y) * 2.4, 1.1);
          });

          const isPinching = Math.sqrt(Math.pow(tip.x - thumb.x, 2) + Math.pow(tip.y - thumb.y, 2)) < 0.05;

          if(isPinching && !cooldown) {
            // Двигаем заметки
            if(Math.sqrt(Math.pow(x-state.winX,2)+Math.pow(y-state.winY,2)) < 0.5) { state.winX = x; state.winY = y; }
            // Активация ИИ
            if(Math.sqrt(Math.pow(x-0,2)+Math.pow(y+0.9,2)) < 0.2) { 
                if(recognition) recognition.start(); 
                cooldown = true; setTimeout(() => cooldown = false, 1000);
            }
          }
        }
        config.notes.position.set(state.winX, state.winY, 0.5);
        config.notes.material.map = createTextCanvas(typedText);
        
        config.vidPanel.visible = state.showVid;
        config.vidPanel.position.set(state.vidX, state.vidY, 0.5);
        if(state.showVid) config.vidPanel.material.map = createTextCanvas("ВИДЕО-ПЛЕЕР\n(YouTube Content)", "red");

        config.renderer.render(config.scene, config.camera);
      });
    }

    const hands = new Hands({locateFile: (f) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
    hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.7 });
    hands.onResults(onResults);
    const cam = new Camera(videoElement, { onFrame: async () => { await hands.send({image: videoElement}); }, facingMode: 'environment' });
    document.getElementById('start').onclick = () => { document.getElementById('ui').style.display='none'; cam.start(); };
  </script>
</body>
</html>
